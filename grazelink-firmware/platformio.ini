; GrazeLink Collar firmware — PlatformIO project file.
; Using PlatformIO (not the Arduino IDE) is what makes the modular
; src/modules/... folder structure work cleanly with plain #include
; paths, and it manages library versions explicitly instead of relying
; on whatever happens to be installed in ~/Arduino/libraries.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit LIS3DH@^1.2.4
    adafruit/Adafruit Unified Sensor@^1.1.14
